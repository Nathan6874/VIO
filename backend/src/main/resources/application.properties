spring.application.name=vio-backend

# Port personnalisé : 8080 indisponible sur la machine de dev de Nathan
server.port=8087

# Profil actif par défaut : local
spring.profiles.active=local

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Taille max des fichiers uploadés
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Répertoire d'upload (chemin absolu)
app.upload.dir=uploads

# Flyway — migrations SQL versionnées
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0